name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          cache: true
          # Temporary pin: floating Deno segfaults libsql tests at shutdown (exit 139).
          # Remove when the upstream Deno/libsql incompatibility is fixed.
          deno-version: 2.9.5
      - name: Install dependencies
        run: deno ci
      - name: Run CI checks
        run: deno task ci
