name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          cache: true
          # Deno 2.9.6 includes NAPI teardown fixes (#36556, #36551, #36559)
          # that resolve the exit-139 segfault with @libsql/client on Ubuntu.
          # See: https://github.com/denoland/deno/releases/tag/v2.9.6
          deno-version: 2.9.6
      - name: Install dependencies
        run: deno ci
      - name: Run CI checks
        run: deno task ci
