name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          cache: true
          # Deno >= 2.9.6 includes NAPI teardown fixes (#36556, #36551, #36559)
          # that resolve the exit-139 segfault with @libsql/client on Ubuntu.
          # See: https://github.com/denoland/deno/releases/tag/v2.9.6
          deno-version: v2.9.8
      - name: Install dependencies
        run: deno ci
      - name: Run CI checks
        run: deno task ci
