name: Publish
on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          cache: true
          # Temporary pin: floating Deno segfaults libsql tests at shutdown (exit 139).
          # Remove when the upstream Deno/libsql incompatibility is fixed.
          deno-version: 2.9.5
      - name: Install dependencies
        run: deno ci
      - name: Run CI checks
        run: deno task ci
      - name: Publish dry run (smoke)
        run: deno task publish:dry
      - name: Publish package
        run: deno publish
