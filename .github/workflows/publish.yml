name: Publish
on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          cache: true
          # Deno 2.9.6 includes NAPI teardown fixes (#36556, #36551, #36559)
          # that resolve the exit-139 segfault with @libsql/client on Ubuntu.
          # See: https://github.com/denoland/deno/releases/tag/v2.9.6
          deno-version: 2.9.6
      - name: Install dependencies
        run: deno ci
      - name: Run CI checks
        run: deno task ci
      - name: Publish dry run (smoke)
        run: deno task publish:dry
      - name: Guard duplicate-version no-op publish
        run: |
          V=$(grep -m1 '"version"' deno.json | sed 's/.*"\([^"]*\)".*/\1/')
          if curl -sf "https://jsr.io/@worlds/libsql/meta.json" | grep -q "\"$V\""; then
            echo "::error::Version $V of @worlds/libsql is already published - bump the version in deno.json or this job ships nothing."
            exit 1
          fi
      - name: Publish package
        run: deno publish
