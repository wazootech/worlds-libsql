name: Publish
on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          cache: true
          # Last known-good Deno: 2.9.5 segfaults libsql native teardown at exit
          # (exit 139, all tests pass first) on ubuntu-latest. Evidence + upstream plan: #41.
          deno-version: 2.8.0
      - name: Install dependencies
        run: deno ci
      - name: Run CI checks
        run: deno task ci
      - name: Publish dry run (smoke)
        run: deno task publish:dry
      - name: Guard duplicate-version no-op publish
        run: |
          V=$(grep -m1 '"version"' deno.json | sed 's/.*"\([^"]*\)".*/\1/')
          if curl -sf "https://jsr.io/@worlds/libsql/meta.json" | grep -q "\"$V\""; then
            echo "::error::Version $V of @worlds/libsql is already published - bump the version in deno.json or this job ships nothing."
            exit 1
          fi
      - name: Publish package
        run: deno publish
